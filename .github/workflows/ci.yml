name: Cloud Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Syntax
        run: |
          python -m py_compile app.py

  build-and-validate-container:
    name: Build & Verify Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t cloud-backend-api:${{ github.sha }} .

      - name: Test Container Run & Health Probe
        run: |
          docker run -d -p 8080:8080 --name test-api cloud-backend-api:${{ github.sha }}
          sleep 5
          docker ps
          curl -f http://localhost:8080/health || exit 1
          docker stop test-api
