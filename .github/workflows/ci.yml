name: Cloud Backend CI/CD & Registry Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Syntax
        run: |
          python -m py_compile app.py

  build-and-validate-container:
    name: Build & Verify Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t cloud-backend-api:${{ github.sha }} .

      - name: Test Container Run & Health Probe
        run: |
          docker run -d -p 8080:8080 --name test-api cloud-backend-api:${{ github.sha }}
          sleep 5
          docker ps
          curl --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 10 -f http://localhost:8080/health || exit 1
          docker stop test-api

  vulnerability-scan:
    name: Scan Image for Vulnerabilities (Trivy)
    needs: build-and-validate-container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image Locally for Scanner
        run: |
          docker build -t cloud-backend-api:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'cloud-backend-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  push-to-registry:
    name: Push Container Image to Docker Hub
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-backend-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-backend-api:${{ github.sha }}
