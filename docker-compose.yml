version: '3.8'

networks:
  backend-network:
    driver: bridge

volumes:
  pgdata:
    driver: local

services:
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: nginx-load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cloud-api-1
      - cloud-api-2
    networks:
      - backend-network
    restart: unless-stopped

  cloud-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-api-1
    environment:
      - PORT=8080
      - DB_HOST=postgres-db
      - REDIS_HOST=redis-cache
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - backend-network
    restart: unless-stopped

  cloud-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-api-2
    environment:
      - PORT=8080
      - DB_HOST=postgres-db
      - REDIS_HOST=redis-cache
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - backend-network
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: cloud_admin
      POSTGRES_PASSWORD: secure_cloud_password_123
      POSTGRES_DB: cloud_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_admin -d cloud_production"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    networks:
      - backend-network
    restart: unless-stopped
